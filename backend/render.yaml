services:
  - type: web
    name: soh-hub-backend
    env: node
    repo: https://github.com/Shield-Nirun/soh-hub-backend
    region: oregon # Change based on your location
    branch: develop
    buildCommand: |
      corepack enable
      corepack prepare yarn@4.6.0 --activate
      yarn --frozen-lockfile install
      yarn build
    startCommand: yarn start
    envVars:
      - key: PORT
        value: 3000
